setup:
  - name: Verify Java 17+ is installed
    run: java -version 2>&1 | head -1

  - name: Build common modules and install to local Maven repo
    run: ./build/mvn -DskipTests install -pl common/tags,common/utils-java,common/utils,common/unsafe,common/kvstore,common/sketch,common/variant,common/network-common -am

  - name: Full build (skip tests)
    run: ./build/mvn -DskipTests clean package

maintenance:
  - name: Rebuild after pulling changes
    run: ./build/mvn -DskipTests clean package

  - name: Install common modules to local Maven repo (needed for running tests on individual modules)
    run: ./build/mvn -DskipTests install -pl common/tags,common/utils-java,common/utils,common/unsafe,common/kvstore,common/sketch,common/variant,common/network-common -am

knowledge:
  - name: Build system
    contents: |
      Apache Spark uses Maven for building. The repo bundles its own Maven wrapper
      at ./build/mvn, so a system-wide Maven installation is not required. Java 17+
      is required (minimum 17.0.11). Scala 2.13 is used. The project version is
      4.2.0-SNAPSHOT.

  - name: Running tests
    contents: |
      Tests require building first. To run all tests: ./dev/run-tests
      To run tests for a specific module: ./build/mvn test -pl <module>
      To run a single test class: ./build/mvn test -pl <module> -Dtest=<TestClassName>
      For ScalaTest suites: ./build/mvn test -pl <module> -Dsuites=<fully.qualified.SuiteName>
      When running tests on individual modules, dependencies must first be installed
      to the local Maven repo using `./build/mvn -DskipTests install -am`.

  - name: Module structure
    contents: |
      The project is a multi-module Maven project. Key modules include:
      - common/tags, common/utils-java, common/utils, common/unsafe, common/kvstore,
        common/sketch, common/variant, common/network-common, common/network-shuffle
      - core, sql/api, sql/catalyst, sql/core, sql/hive
      - streaming, mllib, mllib-local, graphx
      - connector/* (kafka, avro, protobuf, etc.)
      - launcher, repl, tools, assembly, examples

  - name: Gotchas
    contents: |
      - Do not use system `mvn`; always use ./build/mvn which downloads and uses
        Maven 3.9.12 automatically.
      - When testing individual modules with `./build/mvn test -pl <module>`, you
        must first install dependencies to the local Maven repo with
        `./build/mvn -DskipTests install -am -pl <module>`, otherwise you get
        dependency resolution failures.
      - The full build takes a long time (20+ minutes). For iterative development,
        build only the modules you need with -pl and -am flags.
      - JAVA_HOME is auto-detected from javac if not set explicitly.
